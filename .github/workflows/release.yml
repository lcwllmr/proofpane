name: Build and release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# permission to create a release and upload assets
permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64  # Mac Apple Silicon
          - goos: windows
            goarch: amd64  # Windows x64
          - goos: windows
            goarch: arm64  # Windows ARM
          - goos: linux
            goarch: amd64  # Linux x64
          - goos: linux
            goarch: arm64  # Linux ARM

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME="proofpane-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          mkdir -p dist
          go build -o dist/$BINARY_NAME .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proofpane-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1 # We only need this long enough to pass it to the release job

  release:
    name: Create GitHub release
    needs: build
    # Only run this job for tagged releases
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
